name: sagnex

services:
  api:
    image: sagnex-api:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
      args:
        SAGNEX_APT_MIRROR: ${SAGNEX_APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn}
        SAGNEX_NPM_REGISTRY: ${SAGNEX_NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    environment:
      SAGNEX_API_HOST: 0.0.0.0
      SAGNEX_API_PORT: 4784
      SAGNEX_DATA_DIR: /data
      SAGNEX_BACKUP_DIR: /backups
      SAGNEX_AUTH_EMAIL: ${SAGNEX_AUTH_EMAIL:-}
      SAGNEX_SMTP_HOST: ${SAGNEX_SMTP_HOST:-}
      SAGNEX_SMTP_PORT: ${SAGNEX_SMTP_PORT:-587}
      SAGNEX_SMTP_USER: ${SAGNEX_SMTP_USER:-}
      SAGNEX_SMTP_PASSWORD: ${SAGNEX_SMTP_PASSWORD:-}
      SAGNEX_SMTP_FROM: ${SAGNEX_SMTP_FROM:-}
      SAGNEX_SESSION_IDLE_DAYS: ${SAGNEX_SESSION_IDLE_DAYS:-14}
      SAGNEX_SESSION_MAX_DAYS: ${SAGNEX_SESSION_MAX_DAYS:-30}
    user: "${SAGNEX_DOCKER_USER:-1000:1000}"
    volumes:
      - type: bind
        source: ${SAGNEX_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${SAGNEX_BACKUP_DIR:-./data/backups}
        target: /backups
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4784/api/health').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  web:
    image: sagnex-web:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        SAGNEX_APT_MIRROR: ${SAGNEX_APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn}
        SAGNEX_NPM_REGISTRY: ${SAGNEX_NPM_REGISTRY:-https://registry.npmmirror.com}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${SAGNEX_CADDY_BIND_ADDRESS:-0.0.0.0}:${SAGNEX_CADDY_HTTP_PORT:-80}:80"
      - "${SAGNEX_CADDY_BIND_ADDRESS:-0.0.0.0}:${SAGNEX_CADDY_HTTPS_PORT:-443}:443"
    environment:
      SAGNEX_PUBLIC_HOST: ${SAGNEX_PUBLIC_HOST:-sagnex.example.com}
    volumes:
      - type: bind
        source: ./docker/Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
      - type: bind
        source: ${SAGNEX_CADDY_DATA_DIR:-./data/caddy}
        target: /data
        bind:
          create_host_path: true
      - type: bind
        source: ${SAGNEX_CADDY_CONFIG_DIR:-./data/caddy-config}
        target: /config
        bind:
          create_host_path: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
