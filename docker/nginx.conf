# Validate the public browser origin before hiding public request metadata from the API.
map $http_origin $sagnex_request_origin {
    default $http_origin;
    "" "$scheme://$http_host";
}

map $http_sec_fetch_site $sagnex_cross_site {
    default 0;
    cross-site 1;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        set $sagnex_expected_origin "$scheme://$http_host";
        if ($sagnex_cross_site = 1) { return 403; }
        if ($sagnex_request_origin != $sagnex_expected_origin) { return 403; }

        proxy_pass http://api:4784;
        proxy_http_version 1.1;
        proxy_set_header Host api:4784;
        proxy_set_header Origin "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
